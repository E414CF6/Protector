prefix: "<gradient:#38bdf8:#818cf8><bold>Protector</bold></gradient> <dark_gray>»</dark_gray> "
inspect-hud: "<#fbbf24>🔍 Inspect ON</#fbbf24> <gray>| L-Click: Block history · R-Click: Adjacent/Container</gray>"
drops-hud: "<aqua>🛡 Death Drops Protected</aqua> <gray>| Use /unlockdrops to unlock</gray>"

no-permission: "<red>You do not have permission to do that.</red>"
player-only: "<red>Only players can execute this command.</red>"
reload-done: "<green>Protector configuration and messages reloaded.</green>"

guard-tnt-blocked: "<red>✖ TNT ignition is disabled by server guard rules.</red>"
guard-portal-blocked: "<red>✖ Portal creation by non-players is disabled.</red>"
guard-rule-updated: "<green>Guard rule <aqua>{rule}</aqua> set to <white>{state}</white>.</green>"
guard-rule-unknown: "<red>Unknown guard rule <white>{rule}</white>.</red>"

drops-protected: "<aqua>🛡 Your death drops are protected from theft. Use <white>/unlockdrops</white> to unlock.</aqua>"
drops-unlocked: "<green>🔓 Unlocked your protected death drops.</green>"
drops-not-locked: "<gray>You do not have locked death drops.</gray>"
drops-locked-deny: "<red>✖ Those death drops belong to {owner}.</red>"

inspect-enabled: "<green>Inspector mode <bold>enabled</bold>. Left/right-click blocks to view history.</green>"
inspect-disabled: "<yellow>Inspector mode <bold>disabled</bold>.</yellow>"
inspect-empty: "<gray>No audit history found at ({x}, {y}, {z}).</gray>"
rollback-preview-started: "<aqua>Previewing {count} changes! Use <white>/pr apply</white> to apply or <white>/pr cancel</white> to cancel.</aqua>"
rollback-no-matches: "<yellow>No matching audit logs found.</yellow>"
rollback-applied: "<green>Rollback complete: applied <white>{count}</white> changes.</green>"
rollback-cancelled: "<yellow>Rollback preview cancelled.</yellow>"
undo-applied: "<green>Undid last operation (<white>{count}</white> entries).</green>"
undo-empty: "<yellow>No recent rollback/restore operation to undo.</yellow>"
purge-done: "<green>Purged <white>{count}</white> old audit log entries.</green>"
consumer-state: "<green>Audit log consumer state: <aqua>{state}</aqua></green>"
consumer-flushed: "<green>Flushed <white>{count}</white> pending audit event(s) to SQLite.</green>"
command-disabled: "<red>Subcommand <white>/{command}</white> is disabled in command-aliases.yml.</red>"
