# Protector Configuration
language: en

command-aliases:
  register-standalone-aliases: true

modules:
  guard:
    enabled: true
  audit:
    enabled: true

database:
  file: protector.db
  pool-size: 4
  consumer-batch-size: 500
  consumer-flush-interval-ms: 500

guard:
  enabled-worlds: [] # Empty means enabled in all worlds
  protect-death-drops: true
  tnt:
    prevent-prime: false
    prevent-block-damage: true
    prevent-entity-damage: false
    prevent-minecart-tnt: true
  explosions:
    prevent-creeper-block-damage: true
    prevent-wither-damage: true
    prevent-fireball-block-damage: true
    prevent-end-crystal-damage: false
    prevent-bed-anchor-explode: false
  fire:
    prevent-fire-spread: true
    prevent-block-burn: true
    prevent-lava-fire-spread: true
    prevent-lightning-fire: true
  mobs:
    prevent-enderman-grief: true
    prevent-ravager-grief: true
    prevent-wither-block-break: true
  world:
    prevent-non-player-portals: false

audit:
  enabled: true
  log-blocks: true
  log-containers: true
  log-hoppers: true
  log-natural: true
  log-interactions: true
  log-entities: true
  log-signs: true
  log-chat: true
  log-commands: true
  log-sessions: true
  rollback-containers: true
  rollback-entities: true
  default-lookup-limit: 50
  max-rollback-radius: 100
  rollback-blocks-per-tick: 1500
  preview-duration-seconds: 60

ui:
  actionbar:
    enabled: true
    refresh-ticks: 10
    denial-cooldown-ms: 1500
  bossbar:
    enabled: true
    show-mode-banner: true
